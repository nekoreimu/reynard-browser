name: Build Release

on:
  workflow_dispatch:
    inputs:
      variant:
        description: IPA variant to build
        type: choice
        default: all
        required: false
        options:
          - all
          - normal
          - trollstore
          - jailbroken
      disable_lto:
        description: Disable LTO to fit the 6h limit (smaller/slower binary)
        required: false
        default: false
        type: boolean

run-name: "Build Release (${{ inputs.variant || 'all' }})"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      nightly: false
      build_normal_ipa: ${{ inputs.variant == 'all' || inputs.variant == 'normal' }}
      build_trollstore_tipa: ${{ inputs.variant == 'all' || inputs.variant == 'trollstore' }}
      build_jailbroken_ipa: ${{ inputs.variant == 'all' || inputs.variant == 'jailbroken' }}
      disable_lto: ${{ inputs.disable_lto }}
