name: Build Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      variant:
        description: IPA variant to build
        type: choice
        default: all
        required: false
        options:
          - all
          - normal
          - trollstore
          - jailbroken
      disable_lto:
        description: Disable LTO to fit the 6h limit (smaller/slower binary)
        required: false
        default: true
        type: boolean

run-name: "Build Nightly (${{ inputs.variant || 'all' }})"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      nightly: true
      build_normal_ipa: ${{ github.event_name == 'schedule' || inputs.variant == 'all' || inputs.variant == 'normal' }}
      build_trollstore_tipa: ${{ github.event_name == 'schedule' || inputs.variant == 'all' || inputs.variant == 'trollstore' }}
      build_jailbroken_ipa: ${{ github.event_name == 'schedule' || inputs.variant == 'all' || inputs.variant == 'jailbroken' }}
      disable_lto: ${{ github.event_name == 'schedule' || inputs.disable_lto }}
